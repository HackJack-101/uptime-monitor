name: Docker build check

# Pull requests that change the Dockerfile: build the image to catch errors
# before merging. The image is never pushed: master and releases publish it.
on:
  pull_request:
    branches: [master]
    paths: ['Dockerfile']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - name: Build (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            GIT_COMMIT=${{ github.event.pull_request.head.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          pull: true
          cache-from: type=gha
